name: Publish Burnie Jupyter Book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_URL: /AT3_Group4_2026

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build website
        run: myst build --html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4